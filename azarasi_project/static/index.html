<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>あざらしジェネレーターAPI</title>
    <style>
        /* デザインは前回と同じベースです */
        body { font-family: sans-serif; background-color: #e0f7fa; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; }
        main { max-width: 800px; width: 90%; margin-top: 40px; background: white; padding: 40px; border-radius: 15px; text-align: center; }
        .image-container { width: 100%; height: 400px; background-color: #f5f5f5; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 30px; border: 2px dashed #ccc; overflow: hidden;}
        .image-container img { max-width: 100%; max-height: 100%; object-fit: contain; display: none; }
        button { background-color: #00bcd4; color: white; border: none; padding: 15px 40px; font-size: 1.2rem; border-radius: 50px; cursor: pointer; font-weight: bold; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        .loading { display: none; color: #006064; font-weight: bold; }
    </style>
</head>
<body>
    <main>
        <h1>Seal Generator 🦭</h1>
        <p>ボタンを押すと、新しいあざらし画像が生成されます。</p>

        <div class="image-container">
            <img id="sealImage" src="" alt="Generated Seal">
            <span id="placeholder">ボタンを押して生成</span>
            <div id="loading" class="loading">あざらしを生成中...🐟</div>
        </div>

        <button id="fetchBtn" onclick="generateSeal()">Generate & Get!</button>
    </main>

    <script>
        async function generateSeal() {
            const btn = document.getElementById('fetchBtn');
            const img = document.getElementById('sealImage');
            const placeholder = document.getElementById('placeholder');
            const loading = document.getElementById('loading');

            // ローディング状態にする
            btn.disabled = true;
            btn.innerText = "生成中...";
            img.style.display = 'none';
            placeholder.style.display = 'none';
            loading.style.display = 'block';

            try {
                // APIを叩く (画像の生成が走る)
                const response = await fetch('/api/seal');
                const data = await response.json();

                if (data.status === 'success') {
                    img.src = data.message;
                    img.onload = () => {
                        // 画像読み込み完了後に表示
                        loading.style.display = 'none';
                        img.style.display = 'block';
                        btn.disabled = false;
                        btn.innerText = "Generate & Get!";
                    };
                } else {
                    alert('エラーが発生しました');
                    loading.style.display = 'none';
                    btn.disabled = false;
                }
            } catch (error) {
                console.error('Error:', error);
                alert('通信エラー');
                loading.style.display = 'none';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
